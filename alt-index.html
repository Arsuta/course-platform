<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Platform (Alternative)</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
    <script>
      const { createApp, ref } = Vue;
      
      const App = {
        setup() {
          return {
            message: ref('Тестовое приложение Vue')
          }
        },
        template: `
          <div style="padding: 20px; margin: 20px; background-color: #e6f7ff; border: 1px solid #91d5ff; border-radius: 4px; text-align: center;">
            <h1>{{ message }}</h1>
            <p>Альтернативная версия приложения без модулей</p>
          </div>
        `
      };
      
      createApp(App).mount('#app');
    </script>
  </body>
</html>
